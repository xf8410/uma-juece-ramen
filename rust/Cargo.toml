[package]
name = "uma-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ramen_batch"
path = "src/batch.rs"

[[bin]]
name = "ramen_optimize"
path = "src/optimize.rs"

[[bin]]
name = "ramen_card_benchmark"
path = "src/card_benchmark.rs"

[dependencies]
# 2026-09-16: eeae510b → 3b4e940（xf8410/umaai-rs fork：f363386 同步上游 9-15 master
#   + acb7735 回植 ParamOverride GA 注入通道 + 3b4e940 删 region_pt_weight 基因）
# 上游关键变更（8-28 → 9-15，72 commits）：
# - policy.rs：地区打分重构（主位加成 region_main_bias_bonus / 浪费惩罚 region_waste_penalty，
#   移除 pt_bonus/hint 恒定项）；weak_cover 三态化
# - PT 定价固化：pt_tradeoff_shining=36.0 / pt_tradeoff=16.0（7build×100 局标定）
# - 新增 policy_schema 参数包体系（可加载 GA 最优基因）、NN 管线（convert754/ramen_nn/onnx feature）
# - 兼容性验证：jueceramen 全部 API 零破坏（cargo check 绿）；行为对拍 300 局均分 +42（噪声内），
#   RMJ 全通 100%，最高分 63474→66475（上限抬升）
umasim = { git = "https://github.com/xf8410/umaai-rs", rev = "3b4e94038c1d6d5b1ecb27d9684e1893e6dbbda0", default-features = false, features = ["diag", "no-color"] }
jni = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rayon = "1"
anyhow = "1"
log = "0.4"
android_logger = { version = "0.14", optional = true }

[features]
default = ["jni-support"]
jni-support = ["dep:jni", "dep:android_logger"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
