[package]
name = "uma-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ramen_batch"
path = "src/batch.rs"

[[bin]]
name = "ramen_optimize"
path = "src/optimize.rs"

[[bin]]
name = "ramen_card_benchmark"
path = "src/card_benchmark.rs"

[[bin]]
name = "ramen_policy_ab"
path = "src/policy_ab.rs"

[dependencies]
umasim = { git = "https://github.com/xulai1001/umaai-rs", rev = "62dacd592eeceb3ee0ce0401f2f28bf484a69fa3", default-features = false, features = ["diag", "no-color"] }
jni = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rayon = "1"
anyhow = "1"
log = "0.4"

[features]
default = ["jni-support"]
jni-support = ["dep:jni"]

[lints.rust]
unused_imports = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
