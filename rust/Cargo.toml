[package]
name = "uma-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ramen_batch"
path = "src/batch.rs"

[[bin]]
name = "ramen_optimize"
path = "src/optimize.rs"

[[bin]]
name = "ramen_card_benchmark"
path = "src/card_benchmark.rs"

[dependencies]
umasim = { git = "https://github.com/xulai1001/umaai-rs", rev = "7cef1fabfc6083529e3f645d589cf59a74723ef7", default-features = false, features = ["diag", "no-color"] }
jni = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rayon = "1"
anyhow = "1"
log = "0.4"
android_logger = { version = "0.14", optional = true }

[features]
default = ["jni-support"]
jni-support = ["dep:jni", "dep:android_logger"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
