[package]
name = "uma-jni"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ramen_batch"
path = "src/batch.rs"

[[bin]]
name = "ramen_optimize"
path = "src/optimize.rs"

[[bin]]
name = "ramen_card_benchmark"
path = "src/card_benchmark.rs"

[dependencies]
# 2026-08-29: 7cef1fa → eeae510b
# 上游关键变更（8-27/28）：
# - RamenMctsTrainer 的 rollout 与未搜阶段 fallback 切换为 RecommendedRamenTrainer
#   （正式推荐策略）——「手写策略 + 蒙特卡洛」严格叠加，门控全关与纯推荐逐位一致
# - rollout 提速约 -29% CPU（diag 运行时门控）
# - 五维上限剧本化（[3100,2400,2200,2200,2400]）
# - 险胜决策理由输出（output/reason）
umasim = { git = "https://github.com/xulai1001/umaai-rs", rev = "eeae510b57ee9d29a475645a05c191e6ef5a6e72", default-features = false, features = ["diag", "no-color"] }
jni = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rayon = "1"
anyhow = "1"
log = "0.4"
android_logger = { version = "0.14", optional = true }

[features]
default = ["jni-support"]
jni-support = ["dep:jni", "dep:android_logger"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
