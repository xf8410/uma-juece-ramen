[workspace]

[package]
name = "uma-jni"
version = "0.5.0"
edition = "2024"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
umaai_runtime = { path = "../.engine-source/crates/umaai_runtime", default-features = false }
umasim = { path = "../.engine-source/crates/umasim", default-features = false, features = ["no-color"] }
umaai_review = { path = "../.engine-source/crates/umaai_review" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rayon = "1"
jni = { version = "0.21", optional = true }
sha2 = "0.11"

[features]
default = ["jni-support", "onnx"]
jni-support = ["dep:jni"]
onnx = ["umaai_runtime/onnx"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
