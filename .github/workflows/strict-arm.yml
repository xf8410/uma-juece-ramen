name: Strict ARM Native Build

on:
  push:
    branches: ['workbench/strict-arm-native-build']
  workflow_dispatch:

jobs:
  arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Find NDK
        run: |
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
            NDK_DIR="/usr/local/lib/android/sdk/ndk/27.2.12479018/"
          fi
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: strict-arm64-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: strict-arm64-${{ runner.os }}-
      - name: Build ARM64 JNI library
        working-directory: rust
        run: cargo ndk -t arm64-v8a build --release --lib
      - name: Verify and copy ARM64 JNI library
        run: |
          SO=rust/target/aarch64-linux-android/release/libuma_jni.so
          test -s "$SO"
          file "$SO"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libuma_jni.so
      - name: Download gamedata for APK
        run: |
          mkdir -p app/src/main/assets/gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/b53451c09a35c0b59a410f79ae45ce9ccb47cc52/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl --fail --silent --show-error --location "$BASE/$f" -o "app/src/main/assets/gamedata/$f"
            test -s "app/src/main/assets/gamedata/$f"
          done
      - name: Copy optimized strategy to assets
        run: |
          test -s rust/strategy_optimized.json
          cp rust/strategy_optimized.json app/src/main/assets/strategy_optimized.json
      - name: Build APK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle assembleDebug --no-daemon
      - name: Verify JNI library inside APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -Fq 'lib/arm64-v8a/libuma_jni.so' /tmp/apk-files.txt
          unzip -p "$APK" lib/arm64-v8a/libuma_jni.so > /tmp/libuma_jni.so
          test -s /tmp/libuma_jni.so
          cmp -s rust/target/aarch64-linux-android/release/libuma_jni.so /tmp/libuma_jni.so
      - uses: actions/upload-artifact@v4
        with:
          name: uma-juece-ramen-arm64-native-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
