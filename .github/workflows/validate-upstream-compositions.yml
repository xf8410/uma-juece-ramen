name: Validate upstream composition benchmark

on:
  push:
    branches: ['workbench/test-upstream-compositions']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-repository-rust:
    name: Apply diagnosed Rust lint fixes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply and commit source-only fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text()
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text)
              return text != original

          changed = []

          if replace_all('rust/src/batch.rs', [
              ('    final_turn: i32,\n', ''),
              ('    let final_turn = game.turn();\n', ''),
              ('        final_turn,\n', ''),
          ]):
              changed.append('rust/src/batch.rs')

          p = Path('rust/src/optimize.rs')
          text = p.read_text()
          original = text
          text = text.replace(
              '    let best_json_pretty = serde_json::to_string_pretty(&best_strategy).unwrap();\n',
              '',
          )
          text = text.replace('let mut nvec = if', 'let nvec = if')
          text = re.sub(r'\bX\b', 'x', text)
          p.write_text(text)
          if text != original:
              changed.append(str(p))

          if replace_all('rust/src/policy_ab.rs', [
              ('            pt10000: self.pt_10000 as f64 * 100.0 / div,\n', ''),
              ('    pt10000: f64,\n', ''),
          ]):
              changed.append('rust/src/policy_ab.rs')

          print('changed:', changed)
          PY

          if git diff --quiet -- rust/src; then
            echo 'Source is already fixed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/src/batch.rs rust/src/optimize.rs rust/src/policy_ab.rs
          git commit -m 'fix: 清理严格Rust门禁警告 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate-upstream:
    name: Upstream composition tests and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout upstream master
        uses: actions/checkout@v5
        with:
          repository: xulai1001/umaai-rs
          ref: 379e8c6e6236d7e36a1f08fc8f1b36ea77f4ef6d
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile composition benchmark
        run: cargo test --release -p umasim --bin bench_compositions --no-run
      - name: Run composition benchmark tests
        run: cargo test --release -p umasim --bin bench_compositions -- --test-threads=1
      - name: Run all umasim targets
        run: cargo test --release -p umasim --all-targets -- --test-threads=1
      - name: Smoke test all 101 compositions
        run: cargo run --release -p umasim --bin bench_compositions -- --runs 1 --trainer handwritten --out /tmp/bench_compositions.csv
      - name: Verify complete CSV
        run: |
          set -euo pipefail
          test -s /tmp/bench_compositions.csv
          test "$(wc -l < /tmp/bench_compositions.csv)" -eq 102
          awk -F, 'NR > 1 && ($3 != 1 || $4 != 0) { exit 1 }' /tmp/bench_compositions.csv
