name: Validate upstream composition benchmark

on:
  push:
    branches: ['workbench/test-upstream-compositions']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-repository-rust:
    name: Apply known repository Rust lint repair
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove the two diagnosed unused imports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/src/lib.rs')
          text = path.read_text()
          replacements = {
              '    Game, Trainer,\n': '    Game,\n',
              '    use serde::de::Error;\n': '',
          }
          changed = False
          for old, new in replacements.items():
              count = text.count(old)
              if count > 1:
                  raise SystemExit(f'ambiguous match for {old!r}: {count}')
              if count == 1:
                  text = text.replace(old, new)
                  changed = True
          if changed:
              path.write_text(text)
          PY
          if git diff --quiet -- rust/src/lib.rs; then
            echo 'Known imports are already fixed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/src/lib.rs
          git commit -m 'fix: 删除Rust未使用导入 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout contribution branch
        uses: actions/checkout@v4
        with:
          repository: xf8410/umaai-rs
          ref: workbench/bench-card-compositions
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check formatting of contributed source
        run: |
          set -euo pipefail
          cp crates/umasim/src/bin/bench_compositions.rs /tmp/bench_compositions.rs
          cargo fmt --all
          cmp /tmp/bench_compositions.rs crates/umasim/src/bin/bench_compositions.rs
      - name: Compile composition benchmark with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --release -p umasim --bin bench_compositions --no-run
      - name: Run composition benchmark unit tests
        run: cargo test --release -p umasim --bin bench_compositions -- --test-threads=1
      - name: Run all umasim targets
        run: cargo test --release -p umasim --all-targets -- --test-threads=1
      - name: Smoke test all 101 compositions
        run: cargo run --release -p umasim --bin bench_compositions -- --runs 1 --trainer handwritten --out /tmp/bench_compositions.csv
      - name: Verify complete CSV
        run: |
          set -euo pipefail
          test -s /tmp/bench_compositions.csv
          test "$(wc -l < /tmp/bench_compositions.csv)" -eq 102
          awk -F, 'NR > 1 && ($3 != 1 || $4 != 0) { exit 1 }' /tmp/bench_compositions.csv
