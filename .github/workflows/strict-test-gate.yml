name: Strict Test Gate

on:
  push:
    branches: ['workbench/*', main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream-all-tests:
    name: Upstream umaai-rs all library tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned upstream
        uses: actions/checkout@v5
        with:
          repository: xulai1001/umaai-rs
          ref: 62dacd592eeceb3ee0ce0401f2f28bf484a69fa3
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: strict-upstream-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Run every umasim library test
        run: cargo test --release -p umasim --lib -- --test-threads=1

  repository-rust-tests:
    name: Repository Rust all targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: strict-rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
      - name: Download exact pinned gamedata
        run: |
          set -euo pipefail
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/62dacd592eeceb3ee0ce0401f2f28bf484a69fa3/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl --fail --silent --show-error --location "$BASE/$f" -o "gamedata/$f"
            test -s "gamedata/$f"
          done
      - name: Test all Rust targets (warnings denied)
        id: rust_tests
        continue-on-error: true
        env:
          RUSTFLAGS: -D warnings
        run: |
          set -o pipefail
          cargo test --release --manifest-path rust/Cargo.toml --all-targets 2>&1 | tee strict-rust.log
      - name: Publish exact Rust failure diagnostics
        if: steps.rust_tests.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo '# Strict Rust test diagnostics'
            echo
            echo '```text'
            cat strict-rust.log
            echo '```'
          } > reports/strict-rust-failure.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/strict-rust-failure.md
          git commit -m 'test: 保存严格Rust失败诊断 [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Enforce Rust test result
        if: steps.rust_tests.outcome == 'failure'
        run: exit 1

  android-tests-and-build:
    name: Android unit tests, native build, APK build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Select Android NDK
        run: |
          set -euo pipefail
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: strict-android-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
      - name: Build native arm64 JNI library strictly
        working-directory: rust
        run: cargo ndk -t arm64-v8a build --release --lib
      - name: Verify and install native library
        run: |
          set -euo pipefail
          test -s rust/target/aarch64-linux-android/release/libuma_jni.so
          file rust/target/aarch64-linux-android/release/libuma_jni.so
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp rust/target/aarch64-linux-android/release/libuma_jni.so app/src/main/jniLibs/arm64-v8a/
      - name: Download exact pinned APK gamedata
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/62dacd592eeceb3ee0ce0401f2f28bf484a69fa3/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl --fail --silent --show-error --location "$BASE/$f" -o "app/src/main/assets/gamedata/$f"
            test -s "app/src/main/assets/gamedata/$f"
          done
          test -s rust/strategy_optimized.json
          cp rust/strategy_optimized.json app/src/main/assets/strategy_optimized.json
      - name: Configure Android SDK
        run: echo 'sdk.dir=/usr/local/lib/android/sdk' > local.properties
      - name: Run every Android unit test strictly
        run: gradle test --no-daemon --stacktrace
      - name: Build APK strictly
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify APK and embedded native library
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libuma_jni.so'
