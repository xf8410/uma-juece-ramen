name: Build Ramen Android

on:
  push:
    branches: [main, 'workbench/*']
  pull_request:

jobs:
  # ── Job 1: Build batch runner + run tests (host, no NDK needed) ──
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build batch runner
        run: cargo build --release --manifest-path rust/Cargo.toml --bin ramen_batch

      - name: Build JNI lib (host, check compilation)
        run: cargo build --manifest-path rust/Cargo.toml --lib

  # ── Job 2: Android cross-compile + APK ──
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager "ndk;27.2.12479018" || true
          NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK installed at: $NDK_PATH"
          ls "$NDK_PATH" || echo "NDK not found at expected path"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: Build native library (arm64-v8a)
        id: build-native
        continue-on-error: true
        run: |
          cd rust
          cargo ndk -t arm64-v8a build --release 2>&1 || {
            echo "NATIVE_BUILD_FAILED=true" >> $GITHUB_ENV
            exit 0
          }

      - name: Copy .so to jniLibs (if built)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ -f rust/target/aarch64-linux-android/release/libuma_jni.so ]; then
            cp rust/target/aarch64-linux-android/release/libuma_jni.so app/src/main/jniLibs/arm64-v8a/
            echo "Native library copied"
          else
            echo "Native library not built — APK will use fallback TrainingEvaluator"
          fi

      - name: Download gamedata from upstream
        run: |
          mkdir -p app/src/main/assets/gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            echo "Downloading $f..."
            curl -sSL "$BASE/$f" -o "app/src/main/assets/gamedata/$f" || echo "WARN: failed $f"
          done

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: uma-juece-ramen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
