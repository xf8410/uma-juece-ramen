name: Build Ramen Android

on:
  push:
    branches: [main, 'workbench/*']
  pull_request:
  workflow_dispatch:
    inputs:
      sim_count:
        description: '模拟局数（0=不跑模拟）'
        default: '100'
        type: string
      strategy_json:
        description: '策略参数 JSON（留空用默认）'
        default: ''
        type: string
      opt_mode:
        description: '优化模式（cmaes / bayes，留空=不跑优化）'
        default: ''
        type: string
      opt_arg1:
        description: 'CMA-ES=代数 / Bayes=初始采样数'
        default: '10'
        type: string
      opt_arg2:
        description: 'CMA-ES=种群 / Bayes=迭代次数'
        default: '8'
        type: string
      opt_games:
        description: '每次评估局数'
        default: '50'
        type: string

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Build batch runner
        run: cargo build --release --manifest-path rust/Cargo.toml --bin ramen_batch
      - name: Build optimizer
        run: cargo build --release --manifest-path rust/Cargo.toml --bin ramen_optimize
      - name: Build JNI lib
        run: cargo build --manifest-path rust/Cargo.toml --lib

  simulate:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.sim_count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-sim-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            rust-sim-${{ runner.os }}-
            rust-${{ runner.os }}-
      - name: Download gamedata
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || echo "WARN: $f"
          done
      - name: Build batch runner
        run: cargo build --release --manifest-path rust/Cargo.toml --bin ramen_batch
      - name: Run simulation
        env:
          RAMEN_STRATEGY: ${{ github.event.inputs.strategy_json }}
        run: |
          cd /tmp
          cp -r ${{ github.workspace }}/gamedata .
          cp -r ${{ github.workspace }}/rust .
          N="${{ github.event.inputs.sim_count || '100' }}"
          cargo run --release --manifest-path rust/Cargo.toml --bin ramen_batch -- "$N" 2>&1 | tee /tmp/sim_output.txt || echo "SIM_FAILED" >> /tmp/sim_output.txt
          cat /tmp/sim_output.txt >> "$GITHUB_STEP_SUMMARY"

  optimize:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.opt_mode != '' && github.event.inputs.opt_mode != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-opt-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            rust-opt-${{ runner.os }}-
            rust-sim-${{ runner.os }}-
            rust-${{ runner.os }}-
      - name: Download gamedata
        run: |
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "gamedata/$f" || echo "WARN: $f"
          done
      - name: Build optimizer
        run: cargo build --release --manifest-path rust/Cargo.toml --bin ramen_optimize
      - name: Run optimization
        run: |
          cd /tmp
          cp -r ${{ github.workspace }}/gamedata .
          cp -r ${{ github.workspace }}/rust .
          MODE="${{ github.event.inputs.opt_mode }}"
          ARG1="${{ github.event.inputs.opt_arg1 || '10' }}"
          ARG2="${{ github.event.inputs.opt_arg2 || '8' }}"
          GAMES="${{ github.event.inputs.opt_games || '50' }}"
          cargo run --release --manifest-path rust/Cargo.toml --bin ramen_optimize -- "$MODE" "$ARG1" "$ARG2" "$GAMES" 2>&1 | tee /tmp/opt_output.txt || echo "OPT_FAILED" >> /tmp/opt_output.txt
          cat /tmp/opt_output.txt >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true
      - name: Find NDK
        run: |
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            echo "No NDK found, installing..."
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" 2>/dev/null || true
            NDK_DIR="/usr/local/lib/android/sdk/ndk/27.2.12479018/"
          fi
          NDK_DIR="${NDK_DIR%/}"
          echo "NDK at: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: cargo-android-${{ runner.os }}-
      - name: Build native library
        continue-on-error: true
        run: |
          cd rust
          cargo ndk -t arm64-v8a build --release 2>&1 || echo "NATIVE_BUILD_FAILED"
      - name: Copy .so to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if [ -f rust/target/aarch64-linux-android/release/libuma_jni.so ]; then
            cp rust/target/aarch64-linux-android/release/libuma_jni.so app/src/main/jniLibs/arm64-v8a/
            echo "Native library copied"
          else
            echo "No .so — APK will use fallback TrainingEvaluator"
          fi
      - name: Download gamedata for APK
        run: |
          mkdir -p app/src/main/assets/gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "app/src/main/assets/gamedata/$f" || echo "WARN: $f"
          done
      - name: Create local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      - name: Build APK
        run: gradle assembleDebug --no-daemon 2>&1
      - name: Run tests
        run: gradle test --no-daemon || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uma-juece-ramen-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
