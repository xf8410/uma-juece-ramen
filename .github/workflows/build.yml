name: Build Ramen Android (with Native Search)

on:
  push:
    branches: [main, 'workbench/*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018 cmake;3.22.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-ndk-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: cargo-ndk-${{ runner.os }}-

      - name: Build native library (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd rust
          cargo ndk -t arm64-v8a build --release

      - name: Build native library (x86_64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd rust
          cargo ndk -t x86_64 build --release || echo "x86_64 build failed, continuing without it"

      - name: Copy .so to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp rust/target/aarch64-linux-android/release/libuma_jni.so app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "arm64-v8a .so not found"
          mkdir -p app/src/main/jniLibs/x86_64
          cp rust/target/x86_64-linux-android/release/libuma_jni.so app/src/main/jniLibs/x86_64/ 2>/dev/null || echo "x86_64 .so not found, skipping"

      - name: Download gamedata from upstream
        run: |
          mkdir -p app/src/main/assets/gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            echo "Downloading $f..."
            curl -sSL "$BASE/$f" -o "app/src/main/assets/gamedata/$f" || echo "WARN: failed to download $f"
          done
          ls -la app/src/main/assets/gamedata/

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: uma-juece-ramen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
