name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 tag（如 v0.3.0）'
        default: 'v0.4.0'
        type: string
      notes:
        description: '发布说明（留空用默认）'
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Find NDK
        run: |
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$NDK_DIR" ]; then
            echo "No NDK found, installing..."
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" 2>/dev/null || true
            NDK_DIR="/usr/local/lib/android/sdk/ndk/27.2.12479018/"
          fi
          NDK_DIR="${NDK_DIR%/}"
          echo "NDK at: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: Build native library (strict)
        run: |
          cd rust
          cargo ndk -t arm64-v8a build --release 2>&1 | tail -20
          test -s target/aarch64-linux-android/release/libuma_jni.so

      - name: Copy .so to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp rust/target/aarch64-linux-android/release/libuma_jni.so app/src/main/jniLibs/arm64-v8a/

      - name: Download gamedata for APK
        run: |
          mkdir -p app/src/main/assets/gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/master/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl -sSL "$BASE/$f" -o "app/src/main/assets/gamedata/$f"
          done
          ls -la app/src/main/assets/gamedata/

      - name: Copy optimized strategy to assets
        run: |
          if [ -f rust/strategy_optimized.json ]; then
            cp rust/strategy_optimized.json app/src/main/assets/strategy_optimized.json
          fi

      - name: Create local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Build APK (debug-signed, installable)
        run: gradle assembleDebug --no-daemon 2>&1 | tail -30

      - name: Collect release artifacts
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "dist/uma-juece-ramen-${VERSION}.apk"
          sha256sum "dist/uma-juece-ramen-${VERSION}.apk" > dist/SHA256SUMS
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "tag=${VERSION}"
            echo "native_lib=libuma_jni.so (arm64-v8a, strict build)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "build_time=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } > dist/BUILD-MANIFEST.txt
          cat dist/SHA256SUMS dist/BUILD-MANIFEST.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ]; then
            NOTES=$(cat <<'EOF'
          ## 拉面杯决策浮窗 v0.4.0

          ### ★ 三路直读注入（模拟盘面与实况对齐）
          - **羁绊**: `support_cards[].kizuna` / `trainings[].partners[].current_bond`（后者优先）→ `person.friendship`，按 card_id 精确匹配，替掉重放近似
          - **训练等级**: `training_levels[].level` → `base.train_level_count[idx]`（count = (level-1)*4）
          - **角标**: `ramen.command_feelings[].feeling_id` → `ramen.train_feeling_type[5]`（1/2/3 → A/B/C）
          - 字段缺失自动跳过，旧版 hlpatch 行为不变；command_id 兼容 101-105 / 601-605 两套区间

          ### ★ 阶段判定修正
          - 行动画面（trainings 在场）= 面已选完 → 主决策改为训练建议（旧版错误推荐吃面）
          - trainings 空 → 按回合区间给吃面建议

          ### 沿用
          - 断线重连重放 + 直读人头注入 + 推荐策略 rollout（上游 eeae510b）
          - 要求 hlpatch v3.27.24+（support_cards / training_levels / command_feelings 字段；旧版自动回退）

          安装：与通用版同 applicationId（com.umaai.assistant），直接覆盖安装。
          EOF
          )
          fi
          gh release create "$VERSION" --verify-tag --title "$VERSION 拉面杯决策浮窗" --notes "$NOTES" dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uma-juece-ramen-release-apk
          path: dist/*
          if-no-files-found: warn
