name: Restore Ramen repository baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current workbench branch
        uses: actions/checkout@v4
        with:
          ref: workbench/port-pc-ramen-planners
          fetch-depth: 0

      - name: Restore exact main working tree
        run: |
          git fetch origin main
          git rm -r --ignore-unmatch .
          git checkout origin/main -- .
          git clean -fd

      - name: Commit restored Ramen-only baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "fix: restore ramen-only application baseline"
          git push origin HEAD:workbench/port-pc-ramen-planners
