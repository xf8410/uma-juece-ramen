name: Ramen Policy A-B

on:
  workflow_dispatch:
    inputs:
      runs:
        description: '每种卡组构成、每种策略局数'
        required: true
        default: '10000'
        type: string
      seed:
        description: '基础随机种子'
        required: true
        default: '42'
        type: string

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ramen-policy-ab-${{ runner.os }}-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: ramen-policy-ab-${{ runner.os }}-
      - name: Download pinned gamedata
        run: |
          set -euo pipefail
          mkdir -p gamedata
          BASE=https://raw.githubusercontent.com/xulai1001/umaai-rs/62dacd592eeceb3ee0ce0401f2f28bf484a69fa3/gamedata
          for f in constants.json cardDB.json umaDB.json text_data_dict.json events.json scenario_ramen.json scenario_onsen.json default_config.toml; do
            curl --fail --silent --show-error --location "$BASE/$f" -o "gamedata/$f"
            test -s "gamedata/$f"
          done
      - name: Make A use the strategy packaged by the Android app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/src/policy_ab.rs')
          text = path.read_text()
          old = 'let old = RamenStrategy::default();'
          new = '''let old: RamenStrategy = serde_json::from_str(
                  &fs::read_to_string("rust/strategy_optimized.json")?
              )?;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one strategy constructor, found {text.count(old)}')
          text = text.replace(old, new)
          text = text.replace('A：本仓库原手写策略', 'A：Android APK 当前打包的优化策略')
          text = text.replace('A 原策略', 'A APK优化策略')
          path.write_text(text)
          PY
      - name: Build
        run: cargo build --release --manifest-path rust/Cargo.toml --bin ramen_policy_ab
      - name: Run same-seed all-composition A-B
        run: |
          set -euo pipefail
          rust/target/release/ramen_policy_ab '${{ inputs.runs }}' '${{ inputs.seed }}' 2>&1 | tee policy_ab.md
          cat policy_ab.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: ramen-policy-ab-packaged-strategy-report
          path: policy_ab.md
          if-no-files-found: error
      - name: Publish aggregate report to branch
        env:
          RUNS: ${{ inputs.runs }}
          SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          mkdir -p reports
          cp policy_ab.md "reports/policy_ab_packaged_${RUNS}_seed_${SEED}.md"
          git checkout -- rust/src/policy_ab.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/
          if git diff --cached --quiet; then
            echo 'Aggregate report is unchanged.'
          else
            git commit -m "results: 保存APK策略101构成A-B结果 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
