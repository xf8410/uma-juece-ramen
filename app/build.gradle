plugins {
    id 'com.android.application'
}

def buildAbi = providers.gradleProperty('testAbi').getOrElse('arm64-v8a')
if (!(buildAbi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException('testAbi must be arm64-v8a or x86_64')
}

android {
    namespace 'com.umaai.assistant'
    compileSdk 34
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.umaai.assistant"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "0.5.0-dev"
        buildConfigField "String", "SCENARIO_ID", '"Ramen"'

        ndk {
            abiFilters buildAbi
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs += ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
            keepDebugSymbols += ['**/libuma_jni.so']
        }
    }
}

// A missing native engine or an unversioned data directory is a build failure.
// Use scripts/build_android.py to prepare these inputs before Gradle.
tasks.register('verifyPackagingInputs', Exec) {
    workingDir rootProject.projectDir
    commandLine providers.environmentVariable('PYTHON').getOrElse('python'),
            'scripts/verify_artifact.py', '--inputs', '--abi', buildAbi
}
tasks.named('preBuild').configure { dependsOn 'verifyPackagingInputs' }

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
